# d455.yaml — ball_detection_d455.py 配置文件
#
# 所有参数均可被命令行参数覆盖，例如：
#   python ball_detection_d455.py --h-low 20
# 优先级：命令行 > 本文件 > 代码默认值

# ── 分辨率 / 帧率 ──────────────────────────────────────────────────────────────
# 1280×720 @ 30fps（默认）；848×480 可跑 60fps
width:  1280
height: 720

# ── 地面坐标系（开启后弹跳预测才有意义）────────────────────────────────────────
# camera_height：相机光心到地面的高度（米），0.0 = 不启用，EKF 在相机体坐标系运行
# camera_pitch ：相机俯仰角（度），向下看为负值，例如架在三脚架俯视约 -15
camera_height: 0.0
camera_pitch:  0.0

# ── 检测后端 ──────────────────────────────────────────────────────────────────
# hsv   — MOG2 运动掩码 + HSV 颜色分割，快，适合固定背景
# yolo  — YOLOv8 目标检测，对复杂背景更鲁棒
# both  — 并排对比两种方案（窗口左右分屏）
detector: hsv

# ── HSV 颜色范围 ───────────────────────────────────────────────────────────────
# 用 tune_hsv.py 交互调参，按 s 键可直接打印这里的格式
# 室内暖光（默认）：H 10–35；室外冷光/荧光：H 25–80，S/V 可降低到 80
h_low:  10
h_high: 35
s_min:  170
v_min:  170

# ── MOG2 运动滤波 ──────────────────────────────────────────────────────────────
# true  — HSV 与 MOG2 取交集，减少静态背景误检
# false — 纯 HSV，不做运动检测（背景复杂时建议关闭）
motion: true

# ── YOLO 参数（detector 为 yolo 或 both 时有效）─────────────────────────────────
yolo_model: models/yolov8n.pt   # 模型路径，首次运行自动下载（约 6MB）
yolo_imgsz: 480                 # 推理分辨率（越小越快）
yolo_conf:  0.3                 # 置信度阈值（0–1）

# ── 物理参数（源自 ball_localization/src/ball_ekf.cpp）──────────────────────────
# coeff_drag：空气阻力系数 C_d，网球约 0.47–0.65
# rest_*    ：弹地恢复系数，硬地球场约 x=0.50 y=0.54 z=0.71，室内测量约 x=0.37 z=0.70
coeff_drag: 0.47
rest_x: 0.75
rest_y: 0.75
rest_z: 0.75

# ── 可视化 ─────────────────────────────────────────────────────────────────────
viz:       true    # 显示 OpenCV 窗口；false = 无窗口模式（终端输出）
show_mask: false   # 在检测窗口旁显示 HSV+MOG2 掩码（仅 hsv 单模式）
traj:      true    # 显示预测弹道（红线 + 弹跳点青色圆点）

# ── 录制 ──────────────────────────────────────────────────────────────────────
# false        — 不录制
# true         — 自动命名（ball_YYYYMMDD_HHMMSS.mp4）
# "output.mp4" — 指定文件名
record: false
