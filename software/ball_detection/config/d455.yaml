# d455.yaml — ball_detection_d455.py 配置文件
#
# 所有参数均可被命令行参数覆盖，例如：
#   python ball_detection_d455.py --h-low 20
# 优先级：命令行 > 本文件 > 代码默认值

# ── 分辨率 / 帧率 ──────────────────────────────────────────────────────────────
# 1280×720 @ 30fps（默认）；848×480 可跑 60fps
width:  1280
height: 720

# ── 地面坐标系（开启后弹跳预测才有意义）────────────────────────────────────────
# camera_height / camera_pitch 为冷启动初始值，tag 未入画面时使用。
# 一旦检测到 AprilTag，每帧自动更新（EMA 平滑），无需手动测量。
camera_height: 0.5     # 相机光心到地面的高度（米），0.0 = 不启用世界坐标系
camera_pitch:  -10.0   # 相机俯仰角（度），向下看为负值

# ── AprilTag 地面标定 ──────────────────────────────────────────────────────────
# 每帧自动检测，动态更新 camera_height + camera_pitch（EMA 平滑，α=0.3）
# tag_size_m: 0 = 不启用
# 用 generate_apriltag.py 打印，过塑后贴在球场地面
tag_family: tag36h11   # ArUco 族（与打印脚本一致）
tag_id:     1          # tag 编号（手里的实物是 id=1）
tag_size_m: 0.15       # 黑色方块外缘边长（米）；0 = 不启用

# ── 检测后端 ──────────────────────────────────────────────────────────────────
# hsv   — MOG2 运动掩码 + HSV 颜色分割，快，适合固定背景
# yolo  — YOLOv8 目标检测，对复杂背景更鲁棒
# both  — 并排对比两种方案（窗口左右分屏）
detector: both

# ── HSV 颜色范围 ───────────────────────────────────────────────────────────────
# 用 tune_hsv.py 交互调参，按 s 键可直接打印这里的格式
# 荧光黄绿（catch_ball 默认，室外/冷光/一般灯光下推荐）：H 25–80，S/V≥80
# 室内暖光（settings.yaml 原始值，只在特定打光下更准）：H 10–35，S/V≥170
h_low:  25
h_high: 80
s_min:  100
v_min:  100


# ── MOG2 运动滤波 ──────────────────────────────────────────────────────────────
# true  — HSV 与 MOG2 取交集，减少静态背景误检
# false — 纯 HSV，不做运动检测（背景复杂或相机运动时建议关闭）
motion: false

# ── HSV 检测阈值 ───────────────────────────────────────────────────────────────
# 用 tune_hsv_web.py 调参，调好后从"复制 YAML 配置"直接粘贴过来
mog2_threshold: 50     # MOG2 灵敏度：越大越不敏感（背景变化大时调高）
min_radius_px:  3      # 最小检测半径（像素）；太小会误检噪点
circularity:    0.55   # 最小圆度（0–1，1=完美圆形）；网球约 0.55–0.80

# ── YOLO 参数（detector 为 yolo 或 both 时有效）─────────────────────────────────
yolo_model: models/yolov8n.pt   # 模型路径，首次运行自动下载（约 6MB）
yolo_imgsz: 480                 # 推理分辨率（越小越快）
yolo_conf:  0.3                 # 置信度阈值（0–1）

# ── 物理参数（源自 ball_localization/src/ball_ekf.cpp）──────────────────────────
# coeff_drag：空气阻力系数 C_d，网球约 0.47–0.65
# rest_*    ：弹地恢复系数，硬地球场约 x=0.50 y=0.54 z=0.71，室内测量约 x=0.37 z=0.70
coeff_drag: 0.47
rest_x: 0.75
rest_y: 0.75
rest_z: 0.75

# ── 可视化 ─────────────────────────────────────────────────────────────────────
viz:       true    # 显示 OpenCV 窗口；false = 无窗口模式（终端输出）
show_mask: false   # 在检测窗口旁显示 HSV+MOG2 掩码（仅 hsv 单模式）
traj:      true    # 显示预测弹道（红线 + 弹跳点青色圆点）

# ── 录制 ──────────────────────────────────────────────────────────────────────
# false        — 不录制
# true         — 自动命名（ball_YYYYMMDD_HHMMSS.mp4）
# "output.mp4" — 指定文件名
record: false
