# d455_b.yaml — 双 D455 融合方案：相机 B（SN 152522251463）
# 配套使用 d455_a.yaml + run_dual_d455.sh

camera:
  backend: realsense
  serial: "152522251463"       # 指定序列号，防止与 d455_a 争抢设备
  id: d455_b
  align_depth_to_color: true
  enable_depth: true
  fps_tries: [[30, 30]]   # 与 d455_a 保持相同 fps，避免 EKF 权重失衡

width:  848
height: 480

camera_height: 0.5
camera_pitch:  -10.0

tag_family: tag36h11
tag_ids:    [0, 1, 2, 3]
tag_size_m: 0.15

detector: hsv

h_low:  25
h_high: 80
s_min:  75
v_min:  140

motion: true
mog2_threshold: 50
min_radius_px:  3
circularity:    0.55

yolo_model: models/yolov8n.pt
yolo_imgsz: 480
yolo_conf:  0.3

vis_weight: 0.0

coeff_drag: 0.47
rest_x: 0.75
rest_y: 0.75
rest_z: 0.65

viz:       false
show_mask: false
traj:      false

record:     false
record_raw: false
save_traj:  false

# ── 融合配置 ──────────────────────────────────────────────────────────────────
cam_id:      d455_b
fusion_port: 5570

# 端口偏移 = 100：所有端口 +100，mjpeg 5568→5668，与 d455_a 不冲突
port_offset: 100
viz3d:       false
webview:     false
