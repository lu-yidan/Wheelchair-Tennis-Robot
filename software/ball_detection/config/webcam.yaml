# webcam.yaml — ball_detection.py 配置文件 (通用 USB / V4L2 RGB 相机)
#
# 适用 HIKROBOT MV-CS016 / FLIR Blackfly UVC 模式 / Logitech BRIO / Razer Kiyo /
# Arducam IMX477 / 任何 V4L2 摄像头.  无深度，靠 fx·R/r_px 视觉测距即可。
#
# 用法:
#   python ball_detection.py --config config/webcam.yaml
#
# ⚠ 重要：必须先用棋盘格标定相机内参，把 fx/fy/ppx/ppy/dist 填到 camera.intrinsics 下。
#         没有内参 → AprilTag 解出来的高度 / 距离全错。
#         一次性步骤：cv2.calibrateCamera + 8×6 棋盘 (~20 张照片)。
#
# 优先级：命令行 > 本文件 > 代码默认值

# ── 相机后端 ───────────────────────────────────────────────────────────────────
camera:
  backend: webcam
  id:      aoni       # broadcast 在 fusion 包里的 cam_id
  device:  2          # /dev/video2 (AONI 2K QHD); 字符串路径或 RTSP URL 也可
  fourcc:  MJPG       # MJPG → 高帧率 (USB UVC 默认)；YUYV 通常被限制在 30fps
  fps:     60
  # AONI 2K QHD Webcam @1920×1080 标定结果 (calibrate_intrinsics.py, 62 张, 0.46px RMS)
  intrinsics:
    fx:  1331.86
    fy:  1323.24
    ppx: 1019.36
    ppy: 477.47
    dist: [0.040168, 0.065459, -0.028067, -0.006229, -0.021268]

# ── 分辨率 ────────────────────────────────────────────────────────────────────
# AONI 2K QHD 实测支持：1920×1080@60、1280×720@60 (MJPG)
width:  1920
height: 1080

# ── 地面坐标系 ─────────────────────────────────────────────────────────────────
camera_height: 0.5
camera_pitch:  -10.0

# ── AprilTag 地面标定 ──────────────────────────────────────────────────────────
tag_family: tag36h11
tag_ids:    [0, 1, 2, 3]
tag_size_m: 0.15

# ── Tag → world map (多相机融合必需) ──────────────────────────────────────────
# 每个 tag 在共享 world 坐标系里的 6DoF; 检测到不同 tag 都会被映回同一个 world.
tag_world_map: config/tag_world_map.yaml

# ── 检测后端 ──────────────────────────────────────────────────────────────────
detector: hsv

# ── HSV 颜色范围 ───────────────────────────────────────────────────────────────
h_low:  25
h_high: 80
s_min:  75
v_min:  140

motion: false
mog2_threshold: 50
min_radius_px:  3
circularity:    0.55

# ── YOLO 参数 ─────────────────────────────────────────────────────────────────
yolo_model: models/yolov8n.pt
yolo_imgsz: 480
yolo_conf:  0.3

# ── 物理参数 ──────────────────────────────────────────────────────────────────
coeff_drag: 0.47
rest_x: 0.75
rest_y: 0.75
rest_z: 0.65

# ── 可视化 ────────────────────────────────────────────────────────────────────
viz:       true
show_mask: false
traj:      true

# ── 录制 ──────────────────────────────────────────────────────────────────────
record: true
record_raw: true

save_traj: true

# ── Web 查看器 ────────────────────────────────────────────────────────────────
viz3d:          true
viz3d_port:     5565
ctrl_port:      5566

webview:        true
webview_port:   5567
mjpeg_port:     5568

# ── 融合广播 (与 razer.yaml 共享同一个 fusion_port; tag_id 必须一致) ──────────
fusion_host: 127.0.0.1
fusion_port: 5570
