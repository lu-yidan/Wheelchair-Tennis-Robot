<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Ball Detection · Multi-cam Monitor</title>
<style>
  body { font-family: monospace; background: #111; color: #eee;
         margin: 0; padding: 8px; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #6df; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cam { background: #1a1a1a; padding: 6px; border-radius: 4px; min-height: 200px;
         display: flex; flex-direction: column; }
  .cam h2 { margin: 0 0 6px; color: #6df; font-size: 13px; display: flex;
            justify-content: space-between; }
  .cam .src { color: #888; font-weight: normal; }
  .cam .frame { background: #000; border: 1px solid #333;
                aspect-ratio: 16 / 9; display: flex; align-items: center;
                justify-content: center; overflow: hidden; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .err { color: #f66; padding: 16px; text-align: center; }
  #status { margin-top: 8px; padding: 8px; background: #1a1a1a;
            border-radius: 4px; font-size: 12px; color: #ccc; }
  #status .hint { color: #888; }
</style>
</head>
<body>

<h1>Ball Detection · Multi-cam Monitor</h1>

<div class="grid">
  <div class="cam">
    <h2>AONI 2K  <span class="src">localhost:5568</span></h2>
    <div class="frame">
      <img src="http://localhost:5568/main"
           onerror="this.parentNode.innerHTML='&lt;div class=err&gt;AONI MJPEG offline (port 5568)<br>start ball_detection.py with config/webcam.yaml&lt;/div&gt;'">
    </div>
  </div>

  <div class="cam">
    <h2>Razer Kiyo X  <span class="src">localhost:5668</span></h2>
    <div class="frame">
      <img src="http://localhost:5668/main"
           onerror="this.parentNode.innerHTML='&lt;div class=err&gt;Razer MJPEG offline (port 5668)<br>start ball_detection.py with config/razer.yaml&lt;/div&gt;'">
    </div>
  </div>
</div>

<div id="status">
  <strong>FUSED EKF</strong> — see the fusion.py terminal for live coords.
  <br><span class="hint">tail -f /tmp/fusion-logs/fusion.log</span>
  <br><br>
  <strong>设备</strong> — 改了相机或端口? 编辑 monitor.html 顶部的 &lt;img&gt; src 即可。
</div>

</body>
</html>
